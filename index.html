<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>영단어 쑥쑥 🌱</title>
<style>
:root{--bg:#fff6e9;--ink:#2b2340;--sub:#7a7190;--pri:#ff7a59;--pri2:#e8603f;--blue:#5b8def;--blue2:#3f6fd1;--ok:#22b573;--no:#ef4b5c;--yel:#ffc845;--pur:#9b6bf2;--card:#fff;--line:#f0e3d0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 16px 40px;min-height:100vh}
button{font:inherit;cursor:pointer;border:none;color:inherit}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{font-size:22px;margin:0;flex:1}
.back{background:#fff;border-radius:12px;width:42px;height:42px;font-size:20px;box-shadow:0 3px 0 var(--line)}
.hero{background:linear-gradient(135deg,#ffb36b,#ff7a59);color:#fff;border-radius:24px;padding:18px 20px;box-shadow:0 6px 0 #e0623f;margin-bottom:18px}
.hero h1{margin:0 0 4px;font-size:26px}
.hero .meta{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-top:10px}
.xpbar{height:12px;background:rgba(255,255,255,.35);border-radius:9px;overflow:hidden;margin-top:8px}
.xpbar div{height:100%;background:#fff;border-radius:9px;transition:width .4s}
h2{font-size:17px;margin:18px 2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border-radius:999px;padding:9px 14px;font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--line);border:2px solid transparent}
.chip.on{background:#fff1d6;border-color:var(--yel);box-shadow:0 3px 0 #e8b93a}
.chip small{color:var(--sub);font-weight:600}
.selinfo{color:var(--sub);font-size:14px;margin:10px 2px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border-radius:20px;padding:18px 12px;text-align:center;box-shadow:0 5px 0 var(--line);font-weight:800;font-size:17px;transition:transform .08s}
.tile:active,.opt:active,.btn:active,.chip:active{transform:translateY(3px);box-shadow:none}
.tile .ic{font-size:36px;display:block;margin-bottom:6px}
.tile small{display:block;color:var(--sub);font-weight:600;font-size:13px;margin-top:4px}
.tile.wide{grid-column:span 2;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 18px}
.tile.wide .ic{margin:0;font-size:30px}
.btn{display:block;width:100%;padding:15px;border-radius:16px;font-weight:800;font-size:17px;background:var(--pri);color:#fff;box-shadow:0 5px 0 var(--pri2);margin-top:12px}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--blue2)}
.btn.gray{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.green{background:var(--ok);box-shadow:0 5px 0 #179158}
.row{display:flex;gap:10px}.row>*{flex:1}
.seg{display:flex;background:#fff;border-radius:14px;padding:4px;box-shadow:0 3px 0 var(--line)}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:700;background:none}
.seg button.on{background:var(--yel)}
.prog{height:10px;background:#fff;border-radius:9px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.prog div{height:100%;background:var(--ok);transition:width .3s}
.qnum{color:var(--sub);font-size:14px;font-weight:700;margin:8px 2px 14px;display:flex;justify-content:space-between}
.qlabel{text-align:center;color:var(--sub);font-weight:700;margin-bottom:8px}
.prompt{background:#fff;border-radius:22px;padding:26px 16px;text-align:center;font-size:26px;font-weight:800;box-shadow:0 5px 0 var(--line);word-break:keep-all;position:relative}
.prompt.en{font-size:32px;letter-spacing:.5px}
.spk{background:#eef3ff;border-radius:50%;width:40px;height:40px;font-size:19px;vertical-align:middle;margin-left:6px}
.bigspk{width:96px;height:96px;font-size:44px;background:#eef3ff;border-radius:50%}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{background:#fff;border-radius:16px;padding:15px;font-size:18px;font-weight:700;box-shadow:0 4px 0 var(--line);border:3px solid transparent;text-align:center;word-break:keep-all}
.opt.right{border-color:var(--ok);background:#e6f8ef}
.opt.wrong{border-color:var(--no);background:#fdeaec}
input.ans{width:100%;font:inherit;font-size:24px;font-weight:800;text-align:center;padding:15px;border-radius:16px;border:3px solid var(--line);margin-top:16px;outline:none;background:#fff}
input.ans:focus{border-color:var(--yel)}
.hint{text-align:center;color:var(--sub);font-weight:700;margin-top:10px;letter-spacing:4px;min-height:22px}
.fb{border-radius:18px;padding:14px 16px;margin-top:16px;font-weight:700;animation:pop .25s}
.fb.ok{background:#e6f8ef;color:#137a4b}.fb.no{background:#fdeaec;color:#b8283a}
.fb .big{font-size:20px;margin-bottom:4px}
.fb .ansline{color:var(--ink);font-size:17px}
.card3d{margin:10px 0 16px}
.fcard{position:relative;height:280px;cursor:pointer}
.fcard .fback{display:none}.fcard.flip .front{display:none}.fcard.flip .fback{display:flex;animation:pop .25s}
.face{position:absolute;inset:0;background:#fff;border-radius:26px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.face.fback{background:#fffbe9}
.face .w{font-size:36px;font-weight:800;word-break:break-all}
.face .k{font-size:28px;font-weight:800;word-break:keep-all}
.face .tap{position:absolute;bottom:14px;color:var(--sub);font-size:13px}
.star{color:#f5a623}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:grid;gap:10px;align-content:start}
.mbtn{background:#fff;border-radius:14px;padding:14px 8px;min-height:58px;font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--line);border:3px solid transparent;word-break:keep-all}
.mbtn.sel{border-color:var(--blue);background:#eef3ff}
.mbtn.done{visibility:hidden}
.mbtn.bad{border-color:var(--no);animation:shake .35s}
.timebar{height:14px;background:#fff;border-radius:9px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line);margin-bottom:8px}
.timebar div{height:100%;background:linear-gradient(90deg,var(--no),var(--yel));transition:width .25s linear}
.scorebox{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:4px 2px 12px}
.combo{color:var(--pri)}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:18px 0}
.slot{width:38px;height:46px;border-radius:10px;background:#fff;border-bottom:4px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.slot.filled{background:#fff1d6}
.slots.ok .slot{background:#e6f8ef}
.slots.bad{animation:shake .35s}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.ltile{width:48px;height:52px;border-radius:12px;background:var(--blue);color:#fff;font-size:24px;font-weight:800;box-shadow:0 4px 0 var(--blue2)}
.ltile.used{opacity:.2;pointer-events:none}
.list{background:#fff;border-radius:18px;box-shadow:0 4px 0 var(--line);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #f6eee2}
.li:last-child{border-bottom:none}
.li .e{font-weight:800;min-width:40%}
.li .m{flex:1;color:#4a4260;font-size:15px}
.li .cnt{background:#fdeaec;color:var(--no);border-radius:999px;padding:2px 9px;font-size:13px;font-weight:800}
.li .x{background:none;font-size:18px;color:var(--sub)}
.result{text-align:center;background:#fff;border-radius:26px;padding:26px 16px;box-shadow:0 6px 0 var(--line)}
.result .stars{font-size:46px;letter-spacing:6px}
.result .pct{font-size:44px;font-weight:900;margin:6px 0}
.result .msg{font-size:18px;font-weight:700;color:var(--sub)}
.plus{display:inline-block;background:#fff1d6;border-radius:999px;padding:6px 14px;font-weight:800;margin-top:10px}
textarea,input.txt{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:14px;border:2px solid var(--line);background:#fff;outline:none}
textarea{min-height:160px;margin-top:8px}
.note{color:var(--sub);font-size:14px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;z-index:50;animation:pop .2s}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:40;animation:fall linear forwards;border-radius:2px}
.empty{text-align:center;padding:30px 10px;color:var(--sub);font-weight:700}
details{background:#fff;border-radius:16px;box-shadow:0 3px 0 var(--line);margin-bottom:10px;padding:12px 14px}
summary{font-weight:800;cursor:pointer}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast.x{left:50%}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================================================================
   📚 단어장 데이터 — 새 단어장을 추가할 때는 여기에 세트를 추가하세요.
   형식:  영어|뜻
   ================================================================ */
const BOOK_TITLE = 'Words make you';
const BUILTIN_RAW = [
 {id:'ch1', name:'챕터 1', raw:`
accountant|회계사
pervasive|만연한
assimilate|동화하다, 흡수하다
spear|창, 찌르다
lawful|합법적인
entrust|맡기다, 위임하다
strenuous|격렬한, 분투하는
reel|(필름 등) 릴, 얼레
centralize|중앙 집권화하다
cellar|지하실, 저장실
vivacious|활발한, 명랑한
hamper|방해하다
splendid|훌륭한, 정말 좋은
backtrack|되짚어 가다
sabotage|파괴하다
miscellaneous|여러 가지 종류의
denote|조짐을 보이다
utilitarian|실용적인, 공리적인
sensorimotor|감각 운동적인
degrade|비하하다
fleet|함대
perpetual|끝없는, 영원한
evict|쫓아버리다
soluble|녹는
numb|감각이 없는
gravy|육즙
deviant|벗어난, 일탈적인
downfall|몰락
binocular|두 눈으로 보이는
formulate|형성하다
passerby|통행인, 행인
pedagogical|교육학의
naughty|버릇없는
reconciliation|화해
oversee|감독하다
rally|집회, 결집하다
nourish|영양분을 공급하다
entangle|얽히게 하다
recessive|열성의
acclaim|찬사
disperse|흩어지다, 해산하다
meek|온순한, 온화한
dock|부두
conjure|마술을 하다
moist|축축한
standpoint|관점, 입장
aviation|항공(술)
testimony|증거
rehabilitation|재활, 사회복귀
unlock|(열쇠로) 열다
pathway|좁은 길, 오솔길
stake|위험부담, 지분
eject|쫓아내다, 내뿜다
cane|줄기, 지팡이
psychiatrist|정신과 의사
robust|혈기 왕성한
cavity|구멍, 충치
ridicule|조롱, 조롱하다
drape|걸치다
shovel|삽`}
];
const APP_VERSION = 'v1.2';

/* ---------------- 유틸 ---------------- */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const rand = a => a[Math.floor(Math.random()*a.length)];
function parseRaw(raw){
  return raw.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split('|');
    return {en:p[0].trim(), ko:(p[1]||'').trim()};
  }).filter(w => w.en && w.ko);
}
const BUILTIN = BUILTIN_RAW.map(s => ({id:s.id, name:s.name, words:parseRaw(s.raw), builtin:true}));

/* ---------------- 저장 ---------------- */
const KEY = 'ssukssuk-words-v1';
const defState = () => ({xp:0, wrong:{}, custom:[], sel:['ch1'], best:{}, sound:true, qcount:10, front:'en', streak:0, lastDay:'', learned:{}});
function load(){ try { const d = JSON.parse(localStorage.getItem(KEY)); if (d) return Object.assign(defState(), d); } catch(e){} return defState(); }
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

function allSets(){ return BUILTIN.concat(S.custom); }
function allWords(){ const m = new Map(); allSets().forEach(s => s.words.forEach(w => { if (!m.has(w.en)) m.set(w.en, w); })); return [...m.values()]; }
function pool(){
  const m = new Map(), all = allWords();
  S.sel.forEach(id => {
    if (id === 'wrong') all.filter(w => S.wrong[w.en]).forEach(w => m.set(w.en, w));
    else { const s = allSets().find(s => s.id === id); if (s) s.words.forEach(w => m.set(w.en, w)); }
  });
  return [...m.values()];
}
const wrongList = () => allWords().filter(w => S.wrong[w.en]).sort((a,b) => S.wrong[b.en]-S.wrong[a.en]);

/* ---------------- 소리 / 효과 ---------------- */
function speak(t){ try { const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.85; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){} }
let AC;
function beep(ok){
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(); o.connect(g); g.connect(AC.destination);
    const t = AC.currentTime;
    if (ok) { o.type='sine'; o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(990,t+.09); }
    else { o.type='square'; o.frequency.setValueAtTime(200,t); o.frequency.setValueAtTime(150,t+.1); }
    g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.28); o.start(t); o.stop(t+.3);
  } catch(e){}
}
function toast(msg){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const d = document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(), 1800); }
function confetti(){
  const cs = ['#ff7a59','#ffc845','#5b8def','#22b573','#9b6bf2','#ff6fa8'];
  for (let i=0;i<50;i++){ const d=document.createElement('div'); d.className='conf'; d.style.left=Math.random()*100+'vw'; d.style.background=rand(cs); d.style.animationDuration=(1.6+Math.random()*1.6)+'s'; d.style.animationDelay=Math.random()*.4+'s'; document.body.appendChild(d); setTimeout(()=>d.remove(), 3600); }
}
const spk = en => `<button class="spk" onclick="event.stopPropagation();speak('${esc(en).replace(/&#39;/g,"\\'")}')">🔊</button>`;

/* ---------------- 점수 / 레벨 ---------------- */
const LV = ['🌱 새싹','🌿 떡잎','🍀 클로버','🌳 나무','⭐ 별','🏅 메달','🏆 트로피','👑 단어왕'];
const level = () => Math.floor(S.xp/200);
function addXP(n){ const before = level(); S.xp += n; touchDay(); save(); if (level() > before) { setTimeout(()=>{ toast('🎉 레벨 업! '+LV[Math.min(level(),LV.length-1)]); confetti(); }, 300); } }
function dayStr(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function touchDay(){ const t = dayStr(new Date()); if (S.lastDay === t) return; const y = new Date(); y.setDate(y.getDate()-1); S.streak = (S.lastDay === dayStr(y)) ? S.streak+1 : 1; S.lastDay = t; }
function markRight(w){ if (S.wrong[w.en]) { S.wrong[w.en]--; if (S.wrong[w.en] <= 0) delete S.wrong[w.en]; } S.learned[w.en] = (S.learned[w.en]||0)+1; }
function markWrong(w){ S.wrong[w.en] = (S.wrong[w.en]||0)+1; }

/* ---------------- 화면 전환 ---------------- */
let TICK = null;
function stopTick(){ if (TICK) { clearInterval(TICK); TICK = null; } }
function topBar(title, back='home'){ return `<div class="top"><button class="back" onclick="go('${back}')">←</button><h1>${title}</h1></div>`; }
function go(s){
  stopTick();
  try { window.scrollTo(0,0); } catch(e){}
  const screens = {home:home, cards:startCards, test:testMenu, games:gameMenu, wrong:wrongScreen, manage:manage};
  try { screens[s](); } catch(e) { toast('화면 오류: ' + (e && e.message)); if (s !== 'home') home(); }
}
window.addEventListener('error', function(e){ toast('오류: ' + e.message); });

/* ================= 홈 ================= */
function home(){
  const p = pool(), lv = level(), wl = wrongList().length;
  const chips = allSets().map(s => `<button class="chip ${S.sel.includes(s.id)?'on':''}" onclick="toggleSel('${s.id}')">${esc(s.name)} <small>${s.words.length}</small></button>`).join('')
    + `<button class="chip ${S.sel.includes('wrong')?'on':''}" onclick="toggleSel('wrong')">😥 오답 <small>${wl}</small></button>`;
  app.innerHTML = `
  <div class="hero">
    <h1>영단어 쑥쑥 🌱</h1>
    <div style="opacity:.9;font-weight:600">${esc(BOOK_TITLE)} 단어 외우기</div>
    <div class="meta"><span>${LV[Math.min(lv,LV.length-1)]} · Lv.${lv+1}</span><span>🔥 ${S.streak||0}일 · ⭐ ${S.xp}점</span></div>
    <div class="xpbar"><div style="width:${(S.xp%200)/2}%"></div></div>
  </div>
  <h2>📌 공부할 단어 고르기</h2>
  <div class="chips">${chips}</div>
  <div class="selinfo">선택한 단어 <b>${p.length}개</b> · 여러 개를 같이 골라도 돼요</div>
  <h2>🎯 무엇을 할까요?</h2>
  <div class="grid">
    <button class="tile" onclick="go('cards')"><span class="ic">📖</span>단어 카드<small>뒤집으며 외우기</small></button>
    <button class="tile" onclick="go('test')"><span class="ic">✏️</span>시험 보기<small>뜻 쓰기 · 단어 쓰기</small></button>
    <button class="tile" onclick="go('games')"><span class="ic">🎮</span>게임<small>놀면서 외우기</small></button>
    <button class="tile" onclick="go('wrong')"><span class="ic">😥</span>오답 노트<small>${wl}개 남음</small></button>
    <button class="tile wide" onclick="go('manage')"><span class="ic">⚙️</span><span>단어장 관리<small>새 단어 추가 · 소리 설정</small></span></button>
  </div>
  <div class="note" style="text-align:center;margin-top:18px">${APP_VERSION}</div>`;
}
function toggleSel(id){
  if (id === 'wrong' && !wrongList().length && !S.sel.includes('wrong')) { toast('아직 틀린 단어가 없어요 🎉'); return; }
  const i = S.sel.indexOf(id);
  if (i >= 0) S.sel.splice(i,1); else S.sel.push(id);
  save(); home();
}
function needPool(min=1){ const p = pool(); if (p.length < min) { toast(min>1 ? `단어를 ${min}개 이상 골라주세요` : '먼저 공부할 단어를 골라주세요'); return null; } return p; }

/* ================= 단어 카드 ================= */
let F = null;
function startCards(){ const p = needPool(); if (!p) return home(); F = {list:shuffle(p), i:0, flip:false}; renderCard(); }
function renderCard(){
  const w = F.list[F.i], enFront = S.front === 'en';
  const en = `<div class="w">${esc(w.en)}</div><div style="margin-top:12px">${spk(w.en)}</div>`;
  const ko = `<div class="k">${esc(w.ko)}</div>`;
  app.innerHTML = topBar('📖 단어 카드') + `
  <div class="seg"><button class="${enFront?'on':''}" onclick="S.front='en';save();F.flip=false;renderCard()">영어 먼저</button><button class="${!enFront?'on':''}" onclick="S.front='ko';save();F.flip=false;renderCard()">뜻 먼저</button></div>
  <div class="qnum"><span>${F.i+1} / ${F.list.length}</span><span>카드를 누르면 뒤집혀요</span></div>

    <div class="face front">${enFront?en:ko}<div class="tap">👆 눌러서 확인</div></div>
    <div class="face fback">${enFront?ko:en}</div>
  </div></div>
  <div class="row"><button class="btn gray" onclick="cardMove(-1)">◀ 이전</button><button class="btn gray" onclick="cardMove(1)">다음 ▶</button></div>
  <div class="row"><button class="btn" onclick="cardJudge(false)">😥 아직 몰라요</button><button class="btn green" onclick="cardJudge(true)">😊 외웠어요</button></div>`;
  if (enFront && !F.flip) speak(w.en);
  swipe(document.getElementById('fc'), d => cardMove(d));
}
function flipCard(){ F.flip = !F.flip; document.getElementById('fc').classList.toggle('flip', F.flip); if (F.flip && S.front==='ko') speak(F.list[F.i].en); }
function cardMove(d){ F.i = (F.i + d + F.list.length) % F.list.length; F.flip = false; renderCard(); }
function cardJudge(ok){
  const w = F.list[F.i];
  if (ok) { markRight(w); addXP(2); } else { markWrong(w); save(); toast('오답 노트에 담았어요 📒'); }
  if (F.i === F.list.length-1) { confetti(); toast('🎉 한 바퀴 다 봤어요!'); F.list = shuffle(F.list); F.i = 0; F.flip=false; setTimeout(renderCard, 400); }
  else cardMove(1);
}
function swipe(el, cb){
  let x0 = null;
  el.addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive:true});
  el.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 60) { el.onclick = null; cb(dx < 0 ? 1 : -1); } }, {passive:true});
}

  listen:{ic:'🎧',name:'받아쓰기',desc:'발음 듣고 영어 철자 쓰기'},
  mix:{ic:'🎲',name:'섞어서',desc:'여러 문제 유형이 섞여 나와요'}
};

  <div class="grid" style="margin-top:14px">${Object.entries(MODES).map(([k,m])=>`<button class="tile" onclick="startQuiz('${k}')"><span class="ic">${m.ic}</span>${m.name}<small>${m.desc}</small></button>`).join('')}</div>`;
}
let Q = null;
function startQuiz(mode, words){
  words = words || needPool(); if (!words) return;
  let list = shuffle(words); if (S.qcount) list = list.slice(0, S.qcount);
  const typ = ['en2ko','ko2en','mean','spell','listen'];
  Q = {mode, list, i:0, score:0, wrongs:[], answered:false, modes:list.map(()=> mode==='mix' ? rand(typ) : mode), src:words};
  renderQ();
}
function makeOpts(w){
  const others = shuffle(allWords().filter(x => x.en !== w.en && x.ko !== w.ko)).slice(0,3);
  return shuffle([w, ...others]);
}
function renderQ(){
  const w = Q.list[Q.i], m = Q.modes[Q.i]; Q.answered = false;
  let body = '';
  if (m === 'en2ko' || m === 'ko2en') {
    Q.opts = makeOpts(w);
    body = `<div class="qlabel">${m==='en2ko'?'이 단어의 뜻은?':'이 뜻을 가진 영어 단어는?'}</div>
      <div class="prompt ${m==='en2ko'?'en':''}">${esc(m==='en2ko'?w.en:w.ko)}${m==='en2ko'?spk(w.en):''}</div>
      <div class="opts">${Q.opts.map((o,k)=>`<button class="opt" id="o${k}" onclick="pickQ(${k})">${esc(m==='en2ko'?o.ko:o.en)}</button>`).join('')}</div>`;
  } else {
    const lab = {mean:'이 영어 단어의 뜻을 한글로 써 보세요', spell:'이 뜻의 영어 단어를 써 보세요', listen:'잘 듣고 영어 단어를 써 보세요'}[m];
    const pr = m==='mean' ? `<div class="prompt en">${esc(w.en)}${spk(w.en)}</div>`
             : m==='spell' ? `<div class="prompt">${esc(w.ko)}</div>`
             : `<div class="prompt"><button class="bigspk" onclick="speak('${esc(w.en)}')">🔊</button><div class="note" style="margin-top:8px">버튼을 누르면 다시 들려요</div></div>`;
    body = `<div class="qlabel">${lab}</div>${pr}
      <input class="ans" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${m==='mean'?'뜻 입력':'영어로 입력'}" onkeydown="if(event.key==='Enter'){event.preventDefault();Q.answered?nextQ():submitQ()}">
      <div class="hint" id="hint"></div>
      <div class="row"><button class="btn gray" onclick="hintQ()">💡 힌트</button><button class="btn blue" onclick="submitQ()">확인</button></div>`;
  }
  app.innerHTML = topBar('✏️ '+MODES[Q.mode].name, 'test') + `
    <div class="prog"><div style="width:${Q.i/Q.list.length*100}%"></div></div>
    <div class="qnum"><span>${Q.i+1} / ${Q.list.length}</span><span>⭕ ${Q.score}</span></div>${body}<div id="fb"></div>`;
  const inp = document.getElementById('ans'); if (inp) setTimeout(()=>inp.focus(), 50);
  if (m === 'listen') setTimeout(()=>speak(w.en), 250);
  Q.hintN = 0;
}
function hintQ(){
  const w = Q.list[Q.i], m = Q.modes[Q.i], h = document.getElementById('hint'); Q.hintN++;
  if (m === 'mean') h.textContent = '첫 글자: ' + w.ko.replace(/\([^)]*\)\s*/g,'')[0] + ' …';
  else if (m === 'listen' && Q.hintN === 1) { h.style.letterSpacing='0'; h.textContent = '뜻: ' + w.ko; }
  else { const n = Math.min(w.en.length-1, m==='listen'?Q.hintN-1:Q.hintN); h.textContent = w.en.split('').map((c,i)=> i<n ? c : '_').join(' '); }
}
function norm(s){ return s.replace(/\([^)]*\)/g,'').replace(/[\s.~·'"]/g,'').toLowerCase(); }
function meanOk(inp, ko){
  const a = norm(inp); if (!a) return false;
  const parts = ko.split(/[,，/;]/);
  const cands = new Set(); parts.forEach(p => { cands.add(norm(p)); cands.add(p.replace(/[\s()]/g,'')); });
  cands.add(ko.replace(/[\s(),]/g,''));
  if (cands.has(a) || cands.has(inp.replace(/[\s()]/g,''))) return true;
  const stem = x => x.replace(/(하다|하는|한|적인|적|의|이다|다|는|게)$/,'');
  const sa = stem(a);
  return sa.length >= 2 && [...cands].some(c => stem(c) === sa);
}
function pickQ(k){
  if (Q.answered) return;
  const w = Q.list[Q.i], ok = Q.opts[k].en === w.en;
  Q.opts.forEach((o,j) => { if (o.en === w.en) document.getElementById('o'+j).classList.add('right'); });
  if (!ok) document.getElementById('o'+k).classList.add('wrong');
  judge(ok);
}
function submitQ(){
  if (Q.answered) return;
  const w = Q.list[Q.i], m = Q.modes[Q.i], v = document.getElementById('ans').value.trim();
  if (!v) { toast('답을 입력해 주세요'); return; }
  const ok = m === 'mean' ? meanOk(v, w.ko) : v.toLowerCase().replace(/\s+/g,'') === w.en.toLowerCase();
  document.getElementById('ans').disabled = true;
  judge(ok, v);
}
function judge(ok, given){
  Q.answered = true;
  const w = Q.list[Q.i], m = Q.modes[Q.i];
  if (ok) { Q.score++; markRight(w); addXP(Q.hintN ? 5 : 10); } else { Q.wrongs.push(w); markWrong(w); save(); }
  beep(ok);
  const fb = document.getElementById('fb');
  const override = (!ok && m === 'mean') ? `<button class="btn gray" onclick="overrideQ()">✋ 비슷하게 썼어요 (맞음 처리)</button>` : '';
  fb.innerHTML = `<div class="fb ${ok?'ok':'no'}">
      <div class="big">${ok ? rand(['정답! 🎉','잘했어요! 👏','최고예요! 🌟','맞았어요! 💯']) : '아쉬워요 😢'}</div>
      <div class="ansline"><b>${esc(w.en)}</b> = ${esc(w.ko)} ${spk(w.en)}</div>
      ${!ok && given ? `<div style="margin-top:4px;font-weight:600">내 답: ${esc(given)}</div>` : ''}
    </div>${override}
    <button class="btn blue" id="nextb" onclick="nextQ()">${Q.i+1 < Q.list.length ? '다음 문제 →' : '결과 보기 🏁'}</button>`;
  if (ok && m !== 'en2ko' && m !== 'mean') speak(w.en);
  const nb = document.getElementById('nextb'); nb.scrollIntoView({behavior:'smooth', block:'nearest'});
  if (!document.getElementById('ans')) nb.focus();
}
function overrideQ(){
  const w = Q.wrongs.pop(); Q.score++;
  if (S.wrong[w.en]) { S.wrong[w.en]--; if (S.wrong[w.en] <= 0) delete S.wrong[w.en]; }
  addXP(10); beep(true);
  document.querySelector('.fb').className = 'fb ok';
  document.querySelector('.fb .big').textContent = '맞은 걸로 할게요! 👍';
  const ob = document.querySelector('.fb + .btn.gray'); if (ob) ob.remove();
}
function nextQ(){ Q.i++; if (Q.i >= Q.list.length) quizResult(); else renderQ(); }
function quizResult(){
  const n = Q.list.length, pct = Math.round(Q.score/n*100);
  const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 40 ? 1 : 0;
  const msg = ['다시 한번 해 볼까요? 할 수 있어요! 💪','조금씩 늘고 있어요! 🌱','잘했어요! 거의 다 왔어요 👍','완벽해요! 단어 천재 🏆'][stars];
  const key = 'quiz_'+Q.mode; S.best[key] = Math.max(S.best[key]||0, pct); save();
  app.innerHTML = topBar('🏁 시험 결과', 'test') + `
  <div class="result">
    <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div class="pct">${Q.score} / ${n}</div>
    <div class="msg">${msg}</div>
    <div class="plus">정답률 ${pct}% · 최고 기록 ${S.best[key]}%</div>
  </div>
  ${Q.wrongs.length ? `<h2>😥 틀린 단어 (${Q.wrongs.length}개)</h2><div class="list">${Q.wrongs.map(w=>`<div class="li"><span class="e">${esc(w.en)}</span><span class="m">${esc(w.ko)}</span>${spk(w.en)}</div>`).join('')}</div>
     <button class="btn" onclick="retryWrong()">🔁 틀린 단어만 다시 풀기</button>` : ''}
  <div class="row"><button class="btn blue" onclick="startQuiz(Q.mode, Q.src)">다시 하기</button><button class="btn gray" onclick="go('home')">🏠 홈</button></div>`;
  if (stars >= 2) confetti();
}
function retryWrong(){ const qc = S.qcount; S.qcount = 0; startQuiz(Q.mode, Q.wrongs.slice()); S.qcount = qc; }

/* --- 짝꿍 찾기 --- */
function startMatch(){
  const p = needPool(3); if (!p) return;
  G = {type:'match', all:shuffle(p).slice(0,15), round:0, start:Date.now(), miss:0, sl:null, sr:null};
  newMatchRound();
  TICK = setInterval(()=>{ const t = document.getElementById('tm'); if (t) t.textContent = Math.floor((Date.now()-G.start)/1000)+'초'; }, 500);
}
function newMatchRound(){
  const ws = G.all.slice(G.round*5, G.round*5+5);
  G.L = shuffle(ws); G.R = shuffle(ws); G.done = new Set(); G.sl = G.sr = null; renderMatch();
}
function renderMatch(){
  const rounds = Math.ceil(G.all.length/5);
  app.innerHTML = topBar('🧩 짝꿍 찾기', 'games') + `
  <div class="scorebox"><span>라운드 ${G.round+1}/${rounds}</span><span>⏱ <span id="tm">${Math.floor((Date.now()-G.start)/1000)}초</span></span><span>❌ ${G.miss}</span></div>
  <div class="mgrid">
   <div class="mcol">${G.L.map((w,i)=>`<button class="mbtn ${G.done.has(w.en)?'done':''} ${G.sl===i?'sel':''}" id="L${i}" onclick="mPick('l',${i})">${esc(w.en)}</button>`).join('')}</div>
   <div class="mcol">${G.R.map((w,i)=>`<button class="mbtn ${G.done.has(w.en)?'done':''} ${G.sr===i?'sel':''}" id="R${i}" onclick="mPick('r',${i})">${esc(w.ko)}</button>`).join('')}</div>
  </div>`;
}
function mPick(side, i){
  if (G.lock) return;
  if (side === 'l') { G.sl = i; speak(G.L[i].en); } else G.sr = i;
  if (G.sl === null || G.sr === null) return renderMatch();
  const a = G.L[G.sl], b = G.R[G.sr];
  if (a.en === b.en) {
    beep(true); markRight(a); G.done.add(a.en); G.sl = G.sr = null;
    if (G.done.size === G.L.length) {
      G.round++;
      if (G.round*5 >= G.all.length) {
        const sec = Math.floor((Date.now()-G.start)/1000);
        const pts = Math.max(10, G.all.length*10 + 60 - sec - G.miss*5);
        return gameOver('match','짝꿍 찾기 완료!', [`⏱ 걸린 시간: ${sec}초`, `❌ 실수: ${G.miss}번`, `🧩 맞춘 짝: ${G.all.length}개`], pts);
      }
      toast('다음 라운드! 🚀'); return newMatchRound();
    }
    renderMatch();
  } else {
    beep(false); G.miss++; markWrong(a); save(); G.lock = true;
    renderMatch();
    document.getElementById('L'+G.sl).classList.add('bad'); document.getElementById('R'+G.sr).classList.add('bad');
    setTimeout(()=>{ G.lock = false; G.sl = G.sr = null; renderMatch(); }, 450);
  }
}

/* --- 스피드 퀴즈 --- */
function startSpeed(){
  const p = needPool(); if (!p) return;
  G = {type:'speed', p, dur:60000, end:Date.now()+60000, score:0, combo:0, maxc:0, right:0, cnt:0, last:null};
  nextSpeed();
  TICK = setInterval(()=>{
    const left = G.end - Date.now(), b = document.getElementById('tb'), t = document.getElementById('tl');
    if (b) b.style.width = Math.max(0, left/G.dur*100)+'%'; if (t) t.textContent = Math.max(0, Math.ceil(left/1000))+'초';
    if (left <= 0) gameOver('speed','시간 끝!', [`✅ 맞춘 문제: ${G.right} / ${G.cnt}`, `🔥 최대 콤보: ${G.maxc}`], G.score);
  }, 200);
}
function nextSpeed(){
  let w; do { w = rand(G.p); } while (G.p.length > 1 && w === G.last);
  G.last = w; G.w = w; G.dir = Math.random() < .5 ? 'en2ko' : 'ko2en'; G.opts = makeOpts(w); G.busy = false;
  const left = G.end - Date.now();
  app.innerHTML = topBar('⚡ 스피드 퀴즈', 'games') + `
  <div class="timebar"><div id="tb" style="width:${left/G.dur*100}%"></div></div>
  <div class="scorebox"><span>⏱ <span id="tl">${Math.ceil(left/1000)}초</span></span><span class="combo">${G.combo>1?'🔥 '+G.combo+' 콤보':''}</span><span>⭐ ${G.score}</span></div>
  <div class="prompt ${G.dir==='en2ko'?'en':''}">${esc(G.dir==='en2ko'?w.en:w.ko)}</div>
  <div class="opts">${G.opts.map((o,k)=>`<button class="opt" id="o${k}" onclick="pickSpeed(${k})">${esc(G.dir==='en2ko'?o.ko:o.en)}</button>`).join('')}</div>`;
}
function pickSpeed(k){
  if (G.busy || Date.now() > G.end) return; G.busy = true; G.cnt++;
  const ok = G.opts[k].en === G.w.en;
  G.opts.forEach((o,j)=>{ if (o.en === G.w.en) document.getElementById('o'+j).classList.add('right'); });
  if (ok) { G.right++; G.combo++; G.maxc = Math.max(G.maxc, G.combo); G.score += 10 + Math.min(G.combo-1, 10)*2; markRight(G.w); }
  else { document.getElementById('o'+k).classList.add('wrong'); G.combo = 0; markWrong(G.w); }
  save(); beep(ok);
  setTimeout(()=>{ if (Date.now() < G.end) nextSpeed(); }, ok ? 280 : 900);
}

/* --- 철자 퍼즐 --- */
function startPuzzle(){
  const p = needPool(); if (!p) return;
  G = {type:'puzzle', list:shuffle(p).slice(0,8), i:0, score:0, right:0, hints:0};
  newPuzzle();
}
function newPuzzle(){
  const w = G.list[G.i];
  let tiles; do { tiles = shuffle(w.en.split('').map((c,k)=>({c, k, used:false}))); } while (w.en.length > 2 && tiles.map(t=>t.c).join('') === w.en);
  G.tiles = tiles; G.built = []; G.used = 0; G.lock = false; renderPuzzle();
}
function renderPuzzle(state=''){
  const w = G.list[G.i];
  app.innerHTML = topBar('🔠 철자 퍼즐', 'games') + `
  <div class="scorebox"><span>${G.i+1} / ${G.list.length}</span><span>⭐ ${G.score}</span></div>
  <div class="prompt">${esc(w.ko)}</div>
  <div class="slots ${state}" id="slots">${w.en.split('').map((c,i)=>`<div class="slot ${G.built[i]?'filled':''}">${G.built[i]?esc(G.built[i].c):''}</div>`).join('')}</div>
  <div class="tiles">${G.tiles.map((t,i)=>`<button class="ltile ${t.used?'used':''}" onclick="tapTile(${i})">${esc(t.c)}</button>`).join('')}</div>
  <div class="row" style="margin-top:6px"><button class="btn gray" onclick="undoTile()">⌫ 지우기</button><button class="btn gray" onclick="puzzleHint()">💡 힌트</button><button class="btn gray" onclick="speak('${esc(w.en)}')">🔊 듣기</button></div>
  <button class="btn gray" style="margin-top:10px;font-size:14px;padding:10px" onclick="skipPuzzle()">모르겠어요 (정답 보기)</button>`;
}
function tapTile(i){
  if (G.lock) return; const t = G.tiles[i]; if (t.used) return;
  t.used = true; G.built.push(t);
  const w = G.list[G.i];
  if (G.built.length === w.en.length) {
    G.lock = true;
    const ok = G.built.map(t=>t.c).join('') === w.en;
    renderPuzzle(ok ? 'ok' : 'bad'); beep(ok);
    if (ok) { G.score += Math.max(5, 15 - (G.hintsThis||0)*5); G.right++; markRight(w); save(); speak(w.en); setTimeout(nextPuzzle, 900); }
    else setTimeout(()=>{ G.tiles.forEach(t=>t.used=false); G.built=[]; G.lock=false; renderPuzzle(); }, 650);
  } else renderPuzzle();
}
function undoTile(){ if (G.lock) return; const t = G.built.pop(); if (t) t.used = false; renderPuzzle(); }
function puzzleHint(){
  if (G.lock) return;
  const w = G.list[G.i]; G.hintsThis = (G.hintsThis||0)+1; G.hints++;
  let n = 0; while (n < G.built.length && G.built[n].c === w.en[n]) n++;
  G.tiles.forEach(t=>t.used=false); G.built = [];
  for (let j = 0; j <= Math.min(n, w.en.length-2); j++) { const t = G.tiles.find(t=>!t.used && t.c===w.en[j]); t.used = true; G.built.push(t); }
  renderPuzzle();
}
function skipPuzzle(){
  const w = G.list[G.i]; markWrong(w); save(); G.lock = true;
  G.tiles.forEach(t=>t.used=true); G.built = w.en.split('').map(c=>({c}));
  renderPuzzle('bad'); speak(w.en); setTimeout(nextPuzzle, 1600);
}
function nextPuzzle(){
  G.hintsThis = 0; G.i++;
  if (G.i >= G.list.length) return gameOver('puzzle','퍼즐 완성!', [`✅ 혼자 맞춘 단어: ${G.right} / ${G.list.length}`, `💡 힌트 사용: ${G.hints}번`], G.score);
  newPuzzle();
}

/* --- 풍선 터뜨리기 --- */
function startBalloon(){
  const p = needPool(); if (!p) return;
  G = {type:'balloon', p, life:3, score:0, right:0, cnt:0};
  newBalloon();
}
function newBalloon(){
  stopTick();
  const w = rand(G.p); G.w = w; G.opts = makeOpts(w).slice(0,4); G.lock = false; G.cnt++;
  const colors = ['#ff6f91','#ffc845','#5b8def','#22b573'];
  const speed = Math.max(4.5, 9 - G.right*0.25);
  app.innerHTML = topBar('🎈 풍선 터뜨리기', 'games') + `
  <div class="scorebox"><span>${'❤️'.repeat(G.life)}${'🤍'.repeat(3-G.life)}</span><span>⭐ ${G.score}</span></div>
  <div class="prompt" style="padding:18px">${esc(w.ko)}</div>
  <div id="sky" style="position:relative;height:340px;margin-top:12px;background:linear-gradient(#dff1ff,#fff6e9);border-radius:22px;overflow:hidden">
   ${G.opts.map((o,k)=>`<button id="b${k}" onclick="popBalloon(${k})" style="position:absolute;left:${4+k*24}%;width:22%;top:-90px;height:78px;border-radius:50% 50% 46% 46%;background:${colors[k]};color:#fff;font-weight:800;font-size:${o.en.length>10?12:15}px;padding:4px;word-break:break-all;box-shadow:inset -6px -8px 0 rgba(0,0,0,.12)">${esc(o.en)}</button>`).join('')}
  </div>`;
  G.y = G.opts.map((_,k)=> -90 - k*35 - Math.random()*40); G.t0 = Date.now();
  const H = 340, v = (H+120)/(speed*1000);
  let last = Date.now();
  TICK = setInterval(()=>{
    const now = Date.now(), dt = now-last; last = now;
    let landed = false;
    G.opts.forEach((o,k)=>{ const b = document.getElementById('b'+k); if (!b || b.dataset.pop) return; G.y[k] += v*dt; b.style.top = G.y[k]+'px'; if (o.en === G.w.en && G.y[k] > H-10) landed = true; });
    if (landed && !G.lock) missBalloon('땅에 떨어졌어요! 💨');
  }, 30);
}
function popBalloon(k){
  if (G.lock) return;
  const b = document.getElementById('b'+k), ok = G.opts[k].en === G.w.en;
  if (ok) {
    G.lock = true; stopTick(); beep(true); speak(G.w.en); G.right++; G.score += 10 + Math.min(G.right,10); markRight(G.w); save();
    b.dataset.pop = 1; b.style.transition='transform .2s,opacity .2s'; b.style.transform='scale(1.6)'; b.style.opacity='0';
    setTimeout(newBalloon, 600);
  } else { b.style.opacity = '.3'; b.dataset.pop = 1; missBalloon(`${G.opts[k].en} 은(는) 아니에요`); }
}
function missBalloon(msg){
  beep(false); markWrong(G.w); save(); G.life--;
  toast(msg + ' → 정답: ' + G.w.en);
  if (G.life <= 0) { G.lock = true; stopTick(); setTimeout(()=>gameOver('balloon','게임 끝!', [`🎈 터뜨린 풍선: ${G.right}개`], G.score), 900); return; }
  G.lock = true; stopTick(); setTimeout(newBalloon, 1300);
}

/* ================= 오답 노트 ================= */
function wrongScreen(){
  const wl = wrongList();
  app.innerHTML = topBar('😥 오답 노트') + (wl.length ? `
  <div class="note" style="margin:0 2px 10px">틀린 단어가 모여 있어요. 시험에서 맞히면 숫자가 줄고, 0이 되면 사라져요.</div>
  <div class="list">${wl.map(w=>`<div class="li"><span class="e">${esc(w.en)}</span><span class="m">${esc(w.ko)}</span><span class="cnt">${S.wrong[w.en]}</span>${spk(w.en)}<button class="x" onclick="delWrong('${esc(w.en)}')">✕</button></div>`).join('')}</div>
  <div class="row"><button class="btn" onclick="wrongQuiz('en2ko')">🔤 뜻 고르기</button><button class="btn blue" onclick="wrongQuiz('spell')">✍️ 단어 쓰기</button></div>
  <button class="btn gray" onclick="ask('오답 노트를 모두 비울까요?',()=>{S.wrong={};save();wrongScreen()})">🗑 전부 지우기</button>`
  : `<div class="empty"><div style="font-size:60px">🎉</div>오답 노트가 비어 있어요!<br>틀린 단어가 생기면 여기에 모여요.</div>`);
}
function delWrong(en){ delete S.wrong[en]; save(); wrongScreen(); }
function wrongQuiz(m){ const qc = S.qcount; S.qcount = 0; startQuiz(m, wrongList()); S.qcount = qc; }

/* ================= 단어장 관리 ================= */
function manage(){
  app.innerHTML = topBar('⚙️ 단어장 관리') + `
  <h2>📚 들어 있는 단어장</h2>
  ${allSets().map(s=>`<details><summary>${esc(s.name)} (${s.words.length}개) ${s.builtin?'':`<button class="x" style="float:right;background:none;color:var(--no);font-weight:800" onclick="event.preventDefault();delSet('${s.id}')">삭제</button>`}</summary>
    <div class="list" style="box-shadow:none;margin-top:8px">${s.words.map(w=>`<div class="li"><span class="e">${esc(w.en)}</span><span class="m">${esc(w.ko)}</span></div>`).join('')}</div></details>`).join('')}
  <h2>➕ 새 단어장 추가</h2>
  <input class="txt" id="nsName" placeholder="단어장 이름 (비워 두면 다음 챕터 번호)">
  <textarea id="nsWords" placeholder="한 줄에 하나씩 '영어 = 뜻' 형식으로 적어요&#10;apple = 사과&#10;brave = 용감한&#10;curious = 호기심 많은"></textarea>
  <div class="note">= 대신 | 나 탭으로 구분해도 돼요.</div>
  <button class="btn" onclick="addSet()">단어장 저장</button>
  <h2>🔧 설정</h2>
  <div class="row"><button class="btn gray" onclick="S.sound=!S.sound;save();manage()">${S.sound?'🔔 효과음 켜짐':'🔕 효과음 꺼짐'}</button><button class="btn gray" onclick="ask('점수·레벨·오답 기록을 모두 초기화할까요? (단어장은 남아요)',()=>{const c=S.custom;S=defState();S.custom=c;save();toast('초기화했어요');manage()})">♻️ 기록 초기화</button></div>`;
}
function addSet(){
  const name = document.getElementById('nsName').value.trim() || ('챕터 '+(allSets().length+1));
  const words = document.getElementById('nsWords').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const m = l.match(/^(.+?)\s*(?:=|\||\t|:)\s*(.+)$/); if (!m) return null;
    return {en:m[1].trim(), ko:m[2].trim()};
  }).filter(Boolean);
  if (!words.length) return toast("'영어 = 뜻' 형식으로 적어 주세요");
  const id = 'c'+Date.now();
  S.custom.push({id, name, words}); S.sel = [id]; save();
  toast(`✅ ${name} (${words.length}개) 추가!`); go('home');
}
function delSet(id){ ask('이 단어장을 삭제할까요?', ()=>delSetNow(id)); }
function delSetNow(id){ S.custom = S.custom.filter(s=>s.id!==id); S.sel = S.sel.filter(x=>x!==id); save(); manage(); }

function ask(msg, fn){
  const d = document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:rgba(43,35,64,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px';
  d.innerHTML=`<div style="background:#fff;border-radius:22px;padding:22px;max-width:360px;width:100%;text-align:center;font-weight:700;animation:pop .2s">${esc(msg)}<div class="row"><button class="btn gray">취소</button><button class="btn">확인</button></div></div>`;
  const [no, yes] = d.querySelectorAll('button'); no.onclick = () => d.remove(); yes.onclick = () => { d.remove(); fn(); };
  document.body.appendChild(d);
}
/* 시작 */
S.sel = S.sel.filter(id => id==='wrong' || allSets().some(s=>s.id===id));
if (!S.sel.length) S.sel = [allSets()[allSets().length-1].id];
home();
</script>
